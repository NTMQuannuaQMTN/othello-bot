# DQN curriculum training configuration.
# Tuned for CPU-only (pure-Python engine + small conv net, ~100 env steps/s).
seed: 20260828
device: cpu
tag: dqn_curriculum

network:
  channels: 32
  blocks: 2
  hidden: 96
  with_value_head: true
  norm: false

dqn:
  gamma: 0.99
  lr: 0.001
  batch_size: 128
  buffer_capacity: 100000
  warmup_steps: 2000
  train_freq: 2          # one gradient step per 2 env steps
  target_sync: 750       # in gradient steps
  grad_clip: 10.0
  double_dqn: true
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 40000

eval:
  opponents:
    random: random
    greedy: greedy
    heuristic: heuristic
  games: 100
  every: 15000
  seed: 12345

checkpoint_every: 30000

# Potential-based corner-safety shaping (rl/shaping.py). The sparse ±1 reward
# barely teaches the small net about corners; this adds dense feedback — Φ falls
# when the learner sits on an X-square (b2/g2/b7/g7) next to an empty corner and
# rises when it holds corners. Potential-based, so the optimal policy is
# unchanged. Comment the block out (or set enabled: false) to train without it.
shaping:
  corner_weight: 0.20
  x_square_weight: 0.12
  c_square_weight: 0.04

stages:
  - name: stage1_random
    opponent: random
    env_steps: 120000
    learner_color: random
    opening_plies: 4
  - name: stage2_random_greedy
    opponent: [random, greedy]
    env_steps: 120000
    learner_color: random
    opening_plies: 4
  - name: stage3_heuristic
    opponent: [random, greedy, heuristic]
    env_steps: 140000
    learner_color: random
    opening_plies: 4
