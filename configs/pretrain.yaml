# Supervised imitation pretraining of a policy(+value) network (Phase 12.5).
# This is behaviour cloning on historical games, NOT reinforcement learning.

az_network:
  channels: 48
  blocks: 4
  hidden: 128
  norm: true

epochs: 20
lr: 0.001
batch_size: 512
weight_decay: 0.0001
value_loss_weight: 0.5      # total loss = weighted_CE(policy) + w * MSE(value)
seed: 20260901

# candidate promotion (scripts/promote_model.py --config configs/pretrain.yaml)
promotion:
  min_vs_best_lb: 0.50           # Wilson lower bound on win rate vs the current best
  max_baseline_regression: 0.03  # allowed drop vs random / greedy
  min_games: 200
