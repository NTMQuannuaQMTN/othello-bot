# Web app configuration (the Python JSON API — play + analysis, inference only).
# The React front end lives in web/ — `cd web && npm run dev` (dev, proxies /api
# here) or `npm run build` (this server then serves web/dist).
host: 127.0.0.1
port: 8000
static_dir: web/dist        # served when built; falls back to an info page

# The model the site plays / analyses with. Leave `checkpoint` unset to resolve
# it from checkpoints/registry.json (the active-model registry that
# scripts/promote_model.py maintains); set it to pin a specific file.
# checkpoint: models/othello_bot_v1.pt
